<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobby Website - Feedback Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="./images/icon.png">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg topnav">
        <div class="container">
            <a class="navbar-brand title" href="index.html">
                <img class="nav_logo" src="./images/icon.png" alt="Hobby Website">
                <span>Hobby Website<span class="subtitle">by Kai Yang &amp; Zi Yu</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link topnav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link topnav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link topnav-link" href="photography.html">Photography</a></li>
                    <li class="nav-item"><a class="nav-link topnav-link" href="feedback.html">Feedback</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="main pb-2 text-center">
        <div class="container">
            <span class="eyebrow justify-content-center">Feedback Received</span>
            <h1 class="main-title" style="font-size:clamp(2.2rem,4.5vw,3.6rem)">Thanks for your<br>Feedback</h1>
            <p class="intro mx-auto">Here's what we've received!</p>
        </div>
    </header>

    <section class="section pt-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="ticket reveal in" id="ticketWrap">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
                            <div>
                                <div class="text-faint" style="font-size:.7rem;letter-spacing:.15em;text-transform:uppercase">Feedback receipt</div>
                                <div class="h4 mb-0 mt-1" id="ticketName">-</div>
                            </div>
                            <div class="ticket-stamp">RECEIVED</div>
                        </div>

                        <div class="detail-row">
                            <i class="fa-solid fa-envelope"></i>
                            <span class="detail-label">Email</span>
                            <span id="ticketEmail">-</span>
                        </div>
                        <div class="detail-row">
                            <i class="fa-solid fa-calendar"></i>
                            <span class="detail-label">Submitted</span>
                            <span id="ticketDate">-</span>
                        </div>
                        <div class="detail-row">
                            <i class="fa-solid fa-star"></i>
                            <span class="detail-label">Rating</span>
                            <span id="ticketRating">-</span>
                        </div>
                        <div class="detail-row align-items-start">
                            <i class="fa-solid fa-align-left mt-1"></i>
                            <span class="detail-label">Description</span>
                            <span id="ticketDescription" class="text-dim">-</span>
                        </div>

                        <div class="d-flex flex-wrap gap-3 mt-4">
                            <a href="index.html" class="btn-glow"><i class="fa-solid fa-house me-2"></i>Back Home</a>
                            <a href="feedback.html" id="anotherBtn" class="btn-outline-glow"><i class="fa-regular fa-comment me-2"></i>Send Another</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="credit-line">Hobby Website<br>Made by <span class="accent">Kai Yang &amp; Zi Yu</span></div>
</body>
</html>
